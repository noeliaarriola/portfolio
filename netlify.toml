[build]
  command = "npm run build"
  publish = "dist"

# App BiT presentation (static page in public/appbit)
[[redirects]]
  from = "/appbit"
  to = "/appbit/index.html"
  status = 200

# Single-page app: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted bundles
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media and the 3D model change rarely
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=604800"
